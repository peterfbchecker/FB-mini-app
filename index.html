<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:Arial;text-align:center;background:#f0f2f5;}
.box{background:white;padding:20px;border-radius:10px;max-width:400px;margin:50px auto;}
input{width:90%;padding:12px;margin:10px 0;border-radius:5px;border:1px solid #ccc;}
button{background:#1877f2;color:white;padding:12px 20px;border:none;border-radius:5px;width:90%;cursor:pointer;}
#result{margin-top:15px;font-weight:bold;}
</style>
</head>
<body>
<div class="box">
<h2>Facebook Checker</h2>
<p>Paste Facebook Link to Check</p>
<input id="fbLink" placeholder="https://facebook.com/...">
<button onclick="check()">Check Now</button>
<div id="result"></div>
</div>
<script>
function check(){
let link=document.getElementById('fbLink').value;
if(!link){document.getElementById('result').innerHTML='Please paste link';return;}
document.getElementById('result').innerHTML='Checking...';
setTimeout(()=>{document.getElementById('result').innerHTML='Link: '+link;},1000);
}
</script>
<button onclick="Telegram.WebApp.openLink('https://facebook.com')" style="background:green;color:white;padding:15px;width:90%;border-radius:10px;margin-top:20px;">Open Facebook</button>
</body>
</html>
